name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. PHP 8.4 + required extensions
      #    sqlite3 is needed because phpunit.xml configures
      #    DB_CONNECTION=sqlite / DB_DATABASE=:memory: for tests.
      # -------------------------------------------------------
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, bcmath, intl, zip, curl, xml, tokenizer
          coverage: none

      # -------------------------------------------------------
      # 3. Composer dependencies (production + dev, locked)
      # -------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # -------------------------------------------------------
      # 4. Node 22 + npm ci + Vite build
      # -------------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite production assets
        run: npm run build

      # -------------------------------------------------------
      # 5. Laravel environment
      #    phpunit.xml already sets APP_ENV=testing and
      #    DB_CONNECTION=sqlite / DB_DATABASE=:memory:
      #    We only need APP_KEY so Artisan can boot.
      # -------------------------------------------------------
      - name: Generate application key
        run: |
          cp .env.ci .env
          php artisan key:generate --ansi
        env:
          APP_ENV: testing

      # -------------------------------------------------------
      # 6. Run the full test suite
      # -------------------------------------------------------
      - name: Run Laravel tests
        run: php artisan test --compact

      # -------------------------------------------------------
      # 7. Check for whitespace / conflict marker issues
      # -------------------------------------------------------
      - name: Check for whitespace errors
        run: git diff --check
